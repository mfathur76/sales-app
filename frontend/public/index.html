<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="Risol Mejik Sales Tracker - Aplikasi untuk tracking penjualan outlet" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Risol Mejik Sales Tracker</title>
    <script>
      // Troubleshooting switches for phones that show a white screen:
      //   ?safe=bg  plain background (no decorative layers)
      //   ?safe=fx  also no shadows, transforms, animations, filters
      //   ?safe=all no app stylesheets at all
      (function () {
        var m = location.search.match(/[?&]safe=([a-z]+)/);
        var mode = m && m[1];
        if (!mode) return;
        var bg = 'body{background:#f6f7f2!important}body:before,body:after{display:none!important}';
        var fx = bg + '*,*:before,*:after{box-shadow:none!important;text-shadow:none!important;filter:none!important;' +
          '-webkit-backdrop-filter:none!important;backdrop-filter:none!important;transform:none!important;' +
          'transition:none!important;animation:none!important}';
        if (mode === 'bg' || mode === 'fx') document.write('<style>' + (mode === 'bg' ? bg : fx) + '</style>');
        document.addEventListener('DOMContentLoaded', function () {
          if (mode === 'all') {
            var links = document.querySelectorAll('link[rel="stylesheet"], style');
            for (var i = 0; i < links.length; i++) links[i].disabled = true;
          }
          var badge = document.createElement('div');
          badge.style.cssText = 'background:#fff3cd;color:#000;font:12px sans-serif;padding:6px 10px';
          badge.textContent = 'Mode aman: ' + mode + ' · layar ' + innerWidth + '×' + innerHeight +
            ' · dpr ' + (window.devicePixelRatio || 1) + ' · ' + navigator.userAgent;
          document.body.insertBefore(badge, document.body.firstChild);
        });
      })();
    </script>
    <script>
      // Blank-screen guard (plain ES5 so it runs on any browser): if the app has not
      // rendered after a while, show the errors collected so far instead of a white page.
      (function () {
        var errors = [];
        window.__appErrors = errors;
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            errors.push('Gagal memuat file: ' + (t.src || t.href));
          } else {
            errors.push((e.message || 'Error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          errors.push('Promise: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
        });
        window.__resetApp = function () {
          try { localStorage.clear(); sessionStorage.clear(); } catch (err) {}
          var done = function () { location.reload(); };
          try {
            var jobs = [];
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && caches.keys) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(jobs).then(done, done);
          } catch (err) { done(); }
        };
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return;
          var esc = function (s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
          root.innerHTML =
            '<div style="font-family:sans-serif;padding:24px;max-width:560px;margin:0 auto;color:#2c3e50">' +
            '<h2>Aplikasi gagal dimuat</h2>' +
            '<p>Coba muat ulang. Kalau tetap gagal, tekan "Reset data aplikasi" (Anda perlu login lagi), ' +
            'atau kirim foto layar ini ke admin.</p>' +
            '<p><button onclick="location.reload()" style="padding:10px 16px;margin-right:8px">Muat ulang</button>' +
            '<button onclick="__resetApp()" style="padding:10px 16px">Reset data aplikasi</button></p>' +
            '<pre style="white-space:pre-wrap;font-size:12px;background:#f8f9fa;padding:12px;border-radius:8px">' +
            esc((errors.length ? errors.join('\n') : 'Tidak ada pesan error (kemungkinan file aplikasi tidak terunduh).') +
              '\n\nBrowser: ' + navigator.userAgent) +
            '</pre></div>';
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
