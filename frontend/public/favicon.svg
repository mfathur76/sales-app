<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#grad)"/>
  
  <!-- Store building -->
  <rect x="8" y="14" width="16" height="10" fill="#ffffff" rx="1"/>
  
  <!-- Store roof -->
  <polygon points="6,14 16,8 26,14" fill="#ffffff"/>
  
  <!-- Store door -->
  <rect x="13" y="18" width="6" height="6" fill="#667eea" rx="1"/>
  
  <!-- Letter R for Risol -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#667eea">R</text>
</svg> 