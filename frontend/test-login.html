<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🔐 Login Test</h1>
    
    <div class="form-group">
        <label for="apiUrl">API URL:</label>
        <input type="text" id="apiUrl" value="http://localhost:3001/api" placeholder="Enter API URL">
    </div>
    
    <div class="form-group">
        <label for="outlet">Outlet:</label>
        <select id="outlet">
            <option value="">Pilih Outlet</option>
            <option value="RM001">RM001 - Risol Mejik Kelinci Raya</option>
            <option value="RM002">RM002 - Risol Mejik Ketileng</option>
            <option value="RM003">RM003 - Risol Mejik Tlogosari</option>
            <option value="RM004">RM004 - Risol Mejik Karyadi</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter password">
    </div>
    
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testHealth()">Test Health Check</button>
    <button onclick="testOutlets()">Test Get Outlets</button>
    
    <div id="result"></div>

    <script>
        function showResult(message, isError = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${isError ? 'error' : 'success'}`;
            resultDiv.textContent = message;
        }

        async function testHealth() {
            const apiUrl = document.getElementById('apiUrl').value;
            try {
                const response = await fetch(`${apiUrl}/health`);
                const data = await response.json();
                showResult(`Health Check Response:\nStatus: ${response.status}\nData: ${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                showResult(`Health Check Error: ${error.message}`, true);
            }
        }

        async function testOutlets() {
            const apiUrl = document.getElementById('apiUrl').value;
            try {
                const response = await fetch(`${apiUrl}/auth/outlets`);
                const data = await response.json();
                showResult(`Get Outlets Response:\nStatus: ${response.status}\nData: ${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                showResult(`Get Outlets Error: ${error.message}`, true);
            }
        }

        async function testLogin() {
            const apiUrl = document.getElementById('apiUrl').value;
            const outlet = document.getElementById('outlet').value;
            const password = document.getElementById('password').value;
            
            if (!outlet || !password) {
                showResult('Please select outlet and enter password', true);
                return;
            }
            
            try {
                const response = await fetch(`${apiUrl}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ outlet, password }),
                });
                
                const data = await response.json();
                
                let result = `Login Response:\nStatus: ${response.status}\n`;
                result += `Headers: ${JSON.stringify(Object.fromEntries(response.headers.entries()), null, 2)}\n`;
                result += `Data: ${JSON.stringify(data, null, 2)}`;
                
                showResult(result, !data.success);
            } catch (error) {
                showResult(`Login Error: ${error.message}`, true);
            }
        }

        // Auto-detect API URL based on current location
        window.addEventListener('load', function() {
            const currentHost = window.location.hostname;
            const currentProtocol = window.location.protocol;
            const currentPort = window.location.port;
            
            if (currentHost !== 'localhost' && currentHost !== '127.0.0.1') {
                // Production environment
                const apiUrl = `${currentProtocol}//${currentHost}/api`;
                document.getElementById('apiUrl').value = apiUrl;
            }
        });
    </script>
</body>
</html>
