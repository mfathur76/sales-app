service: sales-app-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'ap-southeast-3'}
  stage: ${opt:stage, 'prod'}
  profile: risolmejik
  memorySize: 256
  timeout: 10

  environment:
    NODE_ENV: production
    JWT_SECRET: ${env:JWT_SECRET}
    CORS_ALLOWED_ORIGINS: ${env:CORS_ALLOWED_ORIGINS, '*'}
    OUTLETS_TABLE: ${self:service}-outlets-${self:provider.stage}
    ADMINS_TABLE: ${self:service}-admins-${self:provider.stage}
    SALES_TABLE: ${self:service}-sales-${self:provider.stage}
    EXPENSES_TABLE: ${self:service}-expenses-${self:provider.stage}
    EXPENSE_CATEGORIES_TABLE: ${self:service}-expense-categories-${self:provider.stage}
    ITEM_MASTERS_TABLE: ${self:service}-item-masters-${self:provider.stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-*/index/*

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    target: node18
    platform: node
    concurrency: 10
    keepOutputDirectory: true

package:
  individually: true
  patterns:
    - "!src/**"           # exclude original Express source
    - "!prisma/**"
    - "!data/**"
    - "!*.md"
    - "!ecosystem.config.js"
    - "!nginx.conf"
    - "!dist/**"
    - "!dist-lambda/**"
    - "!node_modules/.cache/**"

functions:
  # ---- Health ----
  healthCheck:
    handler: lambda/handlers/auth.healthCheck
    events:
      - http:
          path: api/health
          method: get
          cors: true

  # ---- Auth ----
  outletLogin:
    handler: lambda/handlers/auth.outletLogin
    events:
      - http:
          path: api/auth/login
          method: post
          cors: true

  listOutletsPublic:
    handler: lambda/handlers/auth.listOutlets
    events:
      - http:
          path: api/auth/outlets
          method: get
          cors: true

  adminLogin:
    handler: lambda/handlers/auth.adminLogin
    events:
      - http:
          path: api/admin/login
          method: post
          cors: true

  # ---- Sales ----
  getSales:
    handler: lambda/handlers/sales.getSales
    events:
      - http:
          path: api/sales
          method: get
          cors: true

  createSale:
    handler: lambda/handlers/sales.createSale
    events:
      - http:
          path: api/sales
          method: post
          cors: true

  getSalesStats:
    handler: lambda/handlers/sales.getSalesStats
    events:
      - http:
          path: api/sales/stats
          method: get
          cors: true

  getSalesStatsOverview:
    handler: lambda/handlers/sales.getSalesStats
    events:
      - http:
          path: api/sales/stats/overview
          method: get
          cors: true

  getSalesOutletOptions:
    handler: lambda/handlers/sales.getSalesOutletOptions
    events:
      - http:
          path: api/sales/outlets
          method: get
          cors: true

  getSaleByOutletDate:
    handler: lambda/handlers/sales.getSaleByOutletDate
    events:
      - http:
          path: api/sales/{outlet}/{date}
          method: get
          cors: true

  updateSale:
    handler: lambda/handlers/sales.updateSale
    events:
      - http:
          path: api/sales/{outlet}/{date}
          method: put
          cors: true

  updateSaleBank:
    handler: lambda/handlers/sales.updateSaleBank
    events:
      - http:
          path: api/sales/{outlet}/{date}/bank
          method: put
          cors: true

  deleteSale:
    handler: lambda/handlers/sales.deleteSale
    events:
      - http:
          path: api/sales/{outlet}/{date}
          method: delete
          cors: true

  # ---- Admin management ----
  getAdminProfile:
    handler: lambda/handlers/admin.getProfile
    events:
      - http:
          path: api/admin/profile
          method: get
          cors: true

  listAdmins:
    handler: lambda/handlers/admin.listAdmins
    events:
      - http:
          path: api/admin/list
          method: get
          cors: true

  createAdmin:
    handler: lambda/handlers/admin.createAdminHandler
    events:
      - http:
          path: api/admin/create
          method: post
          cors: true

  updateAdmin:
    handler: lambda/handlers/admin.updateAdminHandler
    events:
      - http:
          path: api/admin/{username}
          method: put
          cors: true

  deleteAdmin:
    handler: lambda/handlers/admin.deleteAdminHandler
    events:
      - http:
          path: api/admin/{username}
          method: delete
          cors: true

  changePassword:
    handler: lambda/handlers/admin.changePasswordHandler
    events:
      - http:
          path: api/admin/change-password
          method: post
          cors: true

  # ---- Outlets management ----
  getOutlets:
    handler: lambda/handlers/outlets.getOutlets
    events:
      - http:
          path: api/outlets
          method: get
          cors: true

  createOutlet:
    handler: lambda/handlers/outlets.createOutletHandler
    events:
      - http:
          path: api/outlets
          method: post
          cors: true

  getOutletByCode:
    handler: lambda/handlers/outlets.getOutletByCodeHandler
    events:
      - http:
          path: api/outlets/{code}
          method: get
          cors: true

  updateOutlet:
    handler: lambda/handlers/outlets.updateOutletHandler
    events:
      - http:
          path: api/outlets/{code}
          method: put
          cors: true

  deleteOutlet:
    handler: lambda/handlers/outlets.deleteOutletHandler
    events:
      - http:
          path: api/outlets/{code}
          method: delete
          cors: true

  # ---- Expenses ----
  getExpenses:
    handler: lambda/handlers/expenses.getExpenses
    events:
      - http:
          path: api/expenses
          method: get
          cors: true

  createExpense:
    handler: lambda/handlers/expenses.createExpenseHandler
    events:
      - http:
          path: api/expenses
          method: post
          cors: true

  getExpense:
    handler: lambda/handlers/expenses.getExpense
    events:
      - http:
          path: api/expenses/{id}
          method: get
          cors: true

  updateExpense:
    handler: lambda/handlers/expenses.updateExpenseHandler
    events:
      - http:
          path: api/expenses/{id}
          method: put
          cors: true

  deleteExpense:
    handler: lambda/handlers/expenses.deleteExpenseHandler
    events:
      - http:
          path: api/expenses/{id}
          method: delete
          cors: true

  getCategories:
    handler: lambda/handlers/expenses.getCategories
    events:
      - http:
          path: api/expenses/categories
          method: get
          cors: true

  createCategory:
    handler: lambda/handlers/expenses.createCategoryHandler
    events:
      - http:
          path: api/expenses/categories
          method: post
          cors: true

  getItems:
    handler: lambda/handlers/expenses.getItems
    events:
      - http:
          path: api/expenses/items
          method: get
          cors: true

  createItem:
    handler: lambda/handlers/expenses.createItemHandler
    events:
      - http:
          path: api/expenses/items
          method: post
          cors: true

  getWeeklyExpenseReport:
    handler: lambda/handlers/expenses.getWeeklyExpenseReportHandler
    events:
      - http:
          path: api/expenses/reports/weekly
          method: get
          cors: true

  getMonthlyExpenseReport:
    handler: lambda/handlers/expenses.getMonthlyExpenseReportHandler
    events:
      - http:
          path: api/expenses/reports/monthly
          method: get
          cors: true

  getExpenseSummaryReport:
    handler: lambda/handlers/expenses.getExpenseSummaryReportHandler
    events:
      - http:
          path: api/expenses/reports/summary
          method: get
          cors: true

# ---- DynamoDB Tables ----
resources:
  Resources:
    OutletsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-outlets-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    AdminsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-admins-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    SalesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-sales-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI_PK
            AttributeType: S
          - AttributeName: GSI_SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: AllSalesDateIndex
            KeySchema:
              - AttributeName: GSI_PK
                KeyType: HASH
              - AttributeName: GSI_SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    ExpensesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-expenses-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    ExpenseCategoriesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-expense-categories-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    ItemMastersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-item-masters-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
